[project]
name = "ev-transition-monitor"
version = "0.1.0"
description = "European EV Transition Monitor — WifOR Automotive Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17.1",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.22.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyarrow>=16.1.0",
    "openpyxl>=3.1.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "APScheduler>=3.10.4",
    "matplotlib>=3.10.9",
    "gunicorn>=22.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
# This is an application project, not a library — no build backend needed
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
