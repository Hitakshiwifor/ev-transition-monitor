services:
  - type: web
    name: ev-transition-monitor
    runtime: python
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run gunicorn dashboard.app:server --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: DASH_DEBUG
        value: false
      - key: DASH_HOST
        value: 0.0.0.0
