services:
  - type: web
    name: ev-transition-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:server --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: DASH_DEBUG
        value: false
      - key: DASH_HOST
        value: 0.0.0.0
